services:
  # Backend Server API Service
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: task_tracker_server
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - path: ./server/.env
        required: true
    environment:
      - PORT=8080
    volumes:
      - ./server:/app
      - /app/node_modules

  # Frontend Client React Web App Service
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8080/api/v2
        VITE_SOCKET_URI: http://localhost:8080
        VITE_APP_NAME: TaskTracker
    container_name: task_tracker_client
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - server
    volumes:
      - ./client:/app
      - /app/node_modules

